name: Sync bun.lock (one-shot)

on:
  workflow_dispatch:
  push:
    branches: [chore/happy-dom-20-with-bun-lock]
    paths:
      - webui/package.json
      - .github/workflows/sync-bun-lock-oneshot.yml

permissions:
  contents: write

concurrency:
  group: sync-bun-lock-oneshot
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/happy-dom-20-with-bun-lock
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Regenerate webui lockfiles
        working-directory: webui
        run: |
          bun --version
          bun install
          bun install --frozen-lockfile
          npm install --package-lock-only --ignore-scripts

      - name: Commit lockfiles if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webui/bun.lock webui/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "chore(deps): regenerate webui lockfiles for happy-dom ^20.11.2 (Bun 1.3.6)"
          git push origin HEAD:chore/happy-dom-20-with-bun-lock
